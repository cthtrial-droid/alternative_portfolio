    <h1>[CIO 보고] 대체투자 포트폴리오 시사점·인사이트 (2026.06)</h1>
    <p class="sub">본 자료는 내부 관리용 자료입니다. 열람 암호를 입력해 주십시오.</p>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      btn = document.getElementById('btn'), err = document.getElementById('err');

  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}

  f.addEventListener('submit', function(e){
    e.preventDefault();
    err.textContent=''; btn.disabled=true; btn.textContent='복호화 중...';
    setTimeout(function(){ unlock(pw.value); }, 20);
  });

  function unlock(pass){
    if(!window.crypto || !window.crypto.subtle){
      fail('이 브라우저에서는 열람할 수 없습니다. 최신 Chrome/Edge에서 열어 주십시오.'); return;
    }
    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(P.s), iterations:P.i, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    })
    .then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.v)}, key, b64(P.c));
    })
    .then(function(buf){
      render(new TextDecoder().decode(buf));
    })
    .catch(function(){ fail('암호가 올바르지 않습니다.'); });
  }


  // 복호화된 문서를 렌더링한다.
  // document.write()는 Chrome이 외부 스크립트(CDN)를 차단하므로 사용하지 않는다.
  // 1순위: blob URL 최상위 이동 / 2순위: 전체화면 iframe(srcdoc)
  function render(html){
    var done = false;
    try{
      var url = URL.createObjectURL(new Blob([html], {type:'text/html'}));
      var probe = document.createElement('a'); probe.href = url;
      if (probe.protocol === 'blob:' && location.protocol !== 'file:'){
        location.replace(url); done = true;
      }
    }catch(e){}
    if (done) return;
    document.title = P.t || document.title;
    var fr = document.createElement('iframe');
    fr.setAttribute('title', document.title);
    fr.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;background:#fff;z-index:2147483647';
    fr.srcdoc = html;
    document.body.innerHTML = '';
    document.body.style.cssText = 'margin:0;padding:0;background:#fff;display:block';
    document.documentElement.style.cssText = 'margin:0;padding:0';
    document.body.appendChild(fr);
  }

  function fail(m){
    err.textContent = m; btn.disabled=false; btn.textContent='열람하기';
    pw.value=''; pw.focus();
  }
})();
</script>
